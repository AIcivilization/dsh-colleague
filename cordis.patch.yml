# cordis.patch.yml — Cordis bundle 补丁配置
# 用于 dsh plugin add 时自动应用所需的 Cordis 补丁
#
# 安装方式:
#   dsh plugin --profile colleague-dev add ./colleague-plugin
# 验证:
#   dsh --profile colleague-dev --dump-config

# 插件层声明
- id: colleague-plugin
  name: 'colleague-plugin'
  config:
    configPath: 'config/team.yaml'
    maxConcurrentWriters: 1
    memoryEnabled: true

# 依赖声明 — 固定到已验证版本
dependencies:
  - id: '@deepseek-ai/cordis'
    version: '>=4.0.1'
    required: true
  - id: '@deepseek-ai/dsh-session'
    version: '>=0.1.1-rc.1'
    required: true
  - id: '@deepseek-ai/dsh-subagent'
    version: '>=0.1.1-rc.1'
    required: true
  - id: '@deepseek-ai/dsh-agent'
    version: '>=0.1.1-rc.1'
    required: true
  - id: '@deepseek-ai/dsh-tool-subagent'
    version: '>=0.1.1-rc.1'
    required: true

# 可选依赖（增强功能）
optionalDependencies:
  - id: '@deepseek-ai/dsh-web'
    version: '>=0.1.0'
    required: false
    description: '提供 Web 面板宿主，缺失则插件以 headless 模式运行'

# 提供的服务
provides:
  - id: colleague-team
    description: '团队运行时服务，包含 TeamRuntime 实例'
    interface: 'TeamRuntime'

# 注入的服务
inject:
  - dsh-session
  - dsh-subagent

# 可选注入
optionalInject:
  - dsh-web
  - dsh-tool-subagent
