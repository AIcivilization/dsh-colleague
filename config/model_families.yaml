# status: design-doc — This file is a design draft and is NOT loaded by the plugin.
# It documents the intended model family binding strategy for future versions.
# Currently the loader does not reference this file; it is kept for design reference.

# Model family binding config
# Bind to model families; versions can be upgraded

model_families:
  deepseek:
    current_version: "deepseek-v3"
    upgrade_to: "deepseek-v4"
    acp_command: "deepseek"
    description: "DeepSeek model family"

  gpt:
    current_version: "gpt-5.6"
    upgrade_to: "gpt-5.7"
    acp_command: "codex"
    description: "OpenAI GPT model family"

  claude:
    current_version: "claude-opus-4.5"
    acp_command: "claude"
    description: "Anthropic Claude model family"

  gemini:
    current_version: "gemini-2.5-pro"
    acp_command: "gemini"
    description: "Google Gemini model family"

  qwen:
    current_version: "qwen3-coder"
    acp_command: "qwen"
    description: "Alibaba Qwen model family"

  local-ollama:
    current_version: "qwen2.5-coder"
    acp_command: "ollama"
    description: "Local Ollama model family"

# Binding rules:
# 1. Each colleague binds to a model family (not a model version)
# 2. Binding is fixed, but the version can be upgraded
# 3. e.g., bound to gpt5.6, can upgrade to gpt5.7 when gpt updates
