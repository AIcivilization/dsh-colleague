# 模型族绑定配置
# 绑定模型族，版本可升级

model_families:
  deepseek:
    current_version: "deepseek-v3"
    upgrade_to: "deepseek-v4"
    acp_command: "deepseek"
    description: "DeepSeek 模型族"
    
  gpt:
    current_version: "gpt-5.6"
    upgrade_to: "gpt-5.7"
    acp_command: "codex"
    description: "OpenAI GPT 模型族"
    
  claude:
    current_version: "claude-opus-4.5"
    acp_command: "claude"
    description: "Anthropic Claude 模型族"
    
  gemini:
    current_version: "gemini-2.5-pro"
    acp_command: "gemini"
    description: "Google Gemini 模型族"
    
  qwen:
    current_version: "qwen3-coder"
    acp_command: "qwen"
    description: "阿里通义千问模型族"
    
  local-ollama:
    current_version: "qwen2.5-coder"
    acp_command: "ollama"
    description: "本地 Ollama 模型族"

# 绑定规则：
# 1. 每个同事绑定一个模型族（不是模型版本）
# 2. 绑定后固定，但可以升级版本
# 3. 比如绑定 gpt5.6，期间 gpt 升级了，可以换成 gpt5.7
