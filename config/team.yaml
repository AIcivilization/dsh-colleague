# Team config: Frontend Project Team
# Define team members, roles, provider, and workspace

team:
  name: "Frontend Team"
  description: "Full-stack team for frontend development"

# Team member configuration
# role must be one of: leader / coder / reviewer / tester / docs
# provider specifies a registered DSH subagent provider name
members:
  - id: "leader-01"
    template: "./templates/orchestrator.yaml"
    name: "Lead"
    role: "leader"
    provider: "dsh"
    model: "deepseek"
    slot_id: 0

  - id: "coder-01"
    template: "./templates/coder.yaml"
    name: "Coder"
    role: "coder"
    provider: "dsh"
    model: "deepseek"
    slot_id: 1

  - id: "reviewer-01"
    template: "./templates/reviewer.yaml"
    name: "Reviewer"
    role: "reviewer"
    provider: "dsh"
    model: "deepseek"
    slot_id: 2

  - id: "tester-01"
    template: "./templates/tester.yaml"
    name: "Tester"
    role: "tester"
    provider: "dsh"
    model: "deepseek"
    slot_id: 3

  - id: "docs-01"
    template: "./templates/doc-writer.yaml"
    name: "Doc Writer"
    role: "docs"
    provider: "dsh"
    model: "deepseek"
    slot_id: 4

# Workspace config
workspace:
  path: "./workspace/"

# Concurrency config
concurrency:
  max_writers: 1  # Serial writes (first version)

# Memory config
memory:
  enabled: true
  persistence: true  # Persist team events, decisions, verified commands, and quality results

# Intervention controls
intervention:
  enabled: true
  actions:
    - pause
    - resume
    - revise
    - takeover
    - skip
