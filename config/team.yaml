# Team config: Frontend Project Team
# Define team members, roles, provider, and workspace
#
# Note: workspace path and maxConcurrentWriters are set via plugin config
# (index.ts apply()), not from this file. They are kept here for documentation
# reference only. memory.persistence is handled by TeamRuntime automatically.

team:
  id: "frontend-team-01"
  name: "Frontend Team"
  description: "Full-stack team for frontend development"

# Team member configuration
# role must be one of: leader / coder / reviewer / tester / docs
# provider specifies a registered DSH subagent provider name
# Default: "dsh-sdk" (@deepseek-ai/dsh-subagent-dsh-sdk)
# Legacy "dsh" is auto-aliased to "dsh-sdk" (will be removed in next major)
members:
  - id: "leader-01"
    template: "./templates/orchestrator.yaml"
    name: "Lead"
    role: "leader"
    provider: "dsh-sdk"
    model: "deepseek"
    slot_id: 0

  - id: "coder-01"
    template: "./templates/coder.yaml"
    name: "Coder"
    role: "coder"
    provider: "dsh-sdk"
    model: "deepseek"
    slot_id: 1

  - id: "reviewer-01"
    template: "./templates/reviewer.yaml"
    name: "Reviewer"
    role: "reviewer"
    provider: "dsh-sdk"
    model: "deepseek"
    slot_id: 2

  - id: "tester-01"
    template: "./templates/tester.yaml"
    name: "Tester"
    role: "tester"
    provider: "dsh-sdk"
    model: "deepseek"
    slot_id: 3

  - id: "docs-01"
    template: "./templates/doc-writer.yaml"
    name: "Doc Writer"
    role: "docs"
    provider: "dsh-sdk"
    model: "deepseek"
    slot_id: 4

# --- The following sections are informational only ---
# They are NOT loaded by the plugin. Runtime behavior is controlled
# via plugin config (index.ts apply) or hardcoded defaults.
# Kept for documentation of intended design.

# Workspace: path is set via config.workspace in index.ts
# workspace:
#   path: "./workspace/"

# Concurrency: maxConcurrentWriters is set via config.maxConcurrentWriters
# concurrency:
#   max_writers: 1

# Memory: enabled by default, persistence is automatic (events.jsonl)
# memory:
#   enabled: true
#   persistence: true

# Intervention: six actions (pause/resume/revise/takeover/skip/answer)
# are hardcoded and always available. No config-driven toggle.
# intervention:
#   enabled: true
#   actions: [pause, resume, revise, takeover, skip]
