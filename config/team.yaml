# 团队配置：前端项目组
# 定义团队成员名单、角色、provider 和工作区

team:
  name: "前端项目组"
  description: "负责前端开发的全栈团队"

# 团队成员配置
# role 必须是 leader / coder / reviewer / tester / docs 之一
# provider 指定 DSH 已注册的 subagent provider 名称
members:
  - id: "leader-01"
    template: "./templates/orchestrator.yaml"
    name: "组长"
    role: "leader"
    provider: "dsh"
    model: "deepseek"
    slot_id: 0

  - id: "coder-01"
    template: "./templates/coder.yaml"
    name: "码农"
    role: "coder"
    provider: "dsh"
    model: "deepseek"
    slot_id: 1

  - id: "reviewer-01"
    template: "./templates/reviewer.yaml"
    name: "审核员"
    role: "reviewer"
    provider: "dsh"
    model: "deepseek"
    slot_id: 2

  - id: "tester-01"
    template: "./templates/tester.yaml"
    name: "测试员"
    role: "tester"
    provider: "dsh"
    model: "deepseek"
    slot_id: 3

  - id: "docs-01"
    template: "./templates/doc-writer.yaml"
    name: "文档员"
    role: "docs"
    provider: "dsh"
    model: "deepseek"
    slot_id: 4

# 工作区配置
workspace:
  path: "./workspace/"

# 并发配置
concurrency:
  max_writers: 1  # 首版串行写入

# 记忆配置
memory:
  enabled: true
  persistence: true  # 持久化团队事件、架构决定、已验证命令和质量结论

# 介入控制
intervention:
  enabled: true
  actions:
    - pause
    - resume
    - revise
    - takeover
    - skip
