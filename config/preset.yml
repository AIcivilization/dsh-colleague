# dsh preset config: Colleague plugin
# Place this file in dsh's agent-preset directory
# Reference dsh's standard/agent.cordis.yml and preset.yml structure

# ===== preset.yml =====
# Colleague plugin preset — defines the plugin's base configuration

id: colleague
name: 'Colleague Plugin'
description: 'Persistent, role-based AI teams — a multi-agent collaboration plugin for DSH'
version: '1.0.0'
author: 'dsh-colleague'

# DSH package dependencies
dependencies:
  - '@deepseek-ai/dsh-subagent-acp'    # ACP protocol support
  - '@deepseek-ai/dsh-subagent-codex'  # Codex direct connection (optional)
  - '@deepseek-ai/dsh-subagent-claude-code'  # Claude Code direct connection (optional)

# Enabled agents
agents:
  - id: colleague-leader
    name: 'Colleague-Lead'
    preset: './templates/orchestrator.yaml'

  - id: colleague-coder
    name: 'Colleague-Coder'
    preset: './templates/coder.yaml'

  - id: colleague-reviewer
    name: 'Colleague-Reviewer'
    preset: './templates/reviewer.yaml'

  - id: colleague-tester
    name: 'Colleague-Tester'
    preset: './templates/tester.yaml'

  - id: colleague-docs
    name: 'Colleague-Doc Writer'
    preset: './templates/doc-writer.yaml'

# WebUI mode (mode 5: team panel)
webui:
  enabled: true
  entry: './web/team-panel/index.tsx'
  port: 3210

# Agent auto-discovery
discovery:
  enabled: true
  module: './core/discovery/agent-discovery.ts'
  scan_on_startup: true

# Memory system
memory:
  enabled: true
  module: './memory/types.ts'
  levels: ['L0', 'L1', 'L2', 'L3']
  auto_distill: true
